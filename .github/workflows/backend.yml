name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend.tf"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "backend.tf"
  workflow_dispatch:

# The deploy job needs an OIDC token to assume the AWS role. No long-lived
# AWS keys are stored in this repository.
permissions:
  id-token: write
  contents: read

# Frontend and backend deploys share one Terraform state, so they must never
# apply at the same time. Both workflows use this same group name.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

  deploy:
    name: terraform apply
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
