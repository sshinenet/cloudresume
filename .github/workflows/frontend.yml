name: frontend

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "main.js"
      - "counter.js"
      - "style/**"
      - "image/**"
      - "resume/dist/**"
      - "tests/**"
      - "package.json"
      - "main.tf"
      - "variables.tf"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "index.html"
      - "main.js"
      - "counter.js"
      - "style/**"
      - "tests/**"
      - "package.json"
      - "main.tf"
      - "variables.tf"
  workflow_dispatch:

# The deploy job needs an OIDC token to assume the AWS role. No long-lived
# AWS keys are stored in this repository.
permissions:
  id-token: write
  contents: read

# Frontend and backend deploys share one Terraform state, so they must never
# apply at the same time. Both workflows use this same group name.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # There are no dependencies to install: the suite runs on Node's built-in
      # test runner and counter.js takes fetch and storage as parameters.
      - name: Run tests
        run: npm test

  deploy:
    name: terraform apply
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
